# ----------------------------------------------------
# MkDocs 最終配置檔案 (Final Configuration)
# ----------------------------------------------------

site_name: CK Intelligent Fortune 數位花園

# 這是您的 GitHub 儲存庫網址，用於顯示「編輯此頁面」按鈕
repo_url: https://github.com/cychengithub/CK-iFortune_site

# --- 主題與功能設定 ---
theme:
  name: material
  features:
    - content.action.edit  # 啟用「編輯此頁面」按鈕
    # - navigation.expand
    - navigation.sections
  
# --- 樣式連結 ---
extra_css:
  - css/custom.css # <-- 連結您調整字體的 CSS 檔案

# --- 外掛設定 (Plugins) ---
plugins:
  - search
  - awesome-pages  # <-- 新增這個
  - section-index
  - git-revision-date-localized:
      enable_parallel_processing: false
  - awesome-pages:
      filename_case_sensitive: false
      sort_type: natural  # 使用自然排序法處理數字
# --- 新增這整個區塊 ---
markdown_extensions:
  # 標準與基礎功能
  - admonition            # 啟用提示框 (例如 !!! note)
  - codehilite:           # 啟用程式碼高亮
      guess_lang: false
  - toc:                  # 啟用目錄 (TOC) 生成
      permalink: true
  - sane_lists            # 更好的處理列表，避免意外中斷
  - tables                # 啟用 Markdown 表格語法
  - attr_list             # 啟用屬性清單 (例如 { .classname })

  # 來自 Material 主題的擴展（如果適用）
  - pymdownx.betterem      # 更好的強調 (粗體/斜體)
  - pymdownx.details       # 啟用折疊區塊 (<details>)
  - pymdownx.tasklist:    # 啟用任務列表 (例如 [ ] 和 [x])
      custom_checkbox: true
  - pymdownx.superfences  # 啟用更好的程式碼區塊 (這是解決程式碼區塊顯示問題的關鍵)

